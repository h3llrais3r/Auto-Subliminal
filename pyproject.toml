[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=1.2.0"]

[tool.poetry]
name = "autosubliminal"
version = "0.0.0"
description = "Auto-Subliminal, the automated subliminal subtitle downloader"
license = "GPL-3.0"
authors = ["h3llrais3r <h3llrais3r.github@gmail.com>"]
maintainers = ["h3llrais3r <h3llrais3r.github@gmail.com>"]
readme = "README.md"
homepage = "https://h3llrais3r.github.io/Auto-Subliminal"
repository = "https://github.com/h3llrais3r/Auto-Subliminal"
keywords = ["subtitle", "subtitles", "video", "movie", "tv", "show", "episode"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Video",
]
packages = [{ include = "autosubliminal" }, { include = "AutoSubliminal.py" }]

[tool.poetry.dependencies]
# Python version
python = ">=3.9.1,<4"

# Runtime dependencies
babelfish = "0.6.1"
CherryPy = "18.10.0"
deathbycaptcha = "0.1.1"
"dogpile.cache" = "1.4.0"
enzyme = "0.5.2"
ffsubsync = "0.4.29"
GitPython = "3.1.44"
gntp = "1.0.3"
guessit = "3.8.0"
html5lib = "1.1"
imdbpie = { git = "https://github.com/h3llrais3r/imdb-pie.git", rev = "4e5fc35fdafbf8b1d51b54dd722f757f99f98d46" }
jsonpickle = "4.1.0"
langdetect = "1.0.9"
packaging = "24.2"
pysrt = "1.1.2"
python-anticaptcha = "1.0.0"
python-dateutil = "2.9.0.post0"
python-twitter = "3.5"
rebulk = "3.2.0"
requests = "2.32.3"
requests-oauthlib = "2.0.0"
schema = "0.7.7"
simplejson = "3.20.1"
subliminal = "2.2.1"
tailer = "0.4.1"
tvdb_api = { git = "https://github.com/h3llrais3r/tvdb_api.git", rev = "32228cc4af864398198e280bbafbd1ec98567d8f" }
Unidecode = "1.4.0"
ws4py = "0.6.0"

[tool.poetry.group.dev.dependencies]
# Testing
coverage = "7.8.0"
pytest = "8.3.5"
pytest-mock = "3.14.0"
requests-mock = "1.12.1"
vcrpy = "7.0.0"

# Tooling
mypy = "1.15.0"
pigar = "2.1.7"
ruff = "0.11.10"
types-requests = "2.31.0.6"
types-setuptools = "80.3.0.20250505"
types-python-dateutil = "2.9.0.20241206"

[tool.coverage.run]
branch = false
source = ["autosubliminal"]
omit = [
  "autosubliminal/core/enums.py",
  "autosubliminal/providers/addic7ed.py",
  "autosubliminal/providers/useragents.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "@abstractmethod",
  "class CustomRotatingFileHandler",
]

[tool.pytest.ini_options]
addopts = "--verbose"
testpaths = ["tests"]

[tool.mypy]
files = ["AutoSubliminal.py", "autosubliminal", "tests"]
exclude = [
  "autosubliminal/parsers/guessit/rules.py",
  "autosubliminal/providers/addic7ed_custom.py",
  "autosubliminal/providers/opensubtitles_com.py",
  "autosubliminal/providers/pitcher.py",
  "autosubliminal/refiners/omdb_custom.py",
]
ignore_missing_imports = true
no_strict_optional = true
#no_implicit_optional = true # use this instead of no_strict_optional for strict optional check
check_untyped_defs = true
disallow_untyped_defs = true
#disallow_any_unimported = true # use this for checking return types of imported libs
show_error_codes = true
warn_unused_ignores = true
warn_return_any = true

[tool.ruff]
extend-exclude = [
  ".build",
  ".cache",
  ".github",
  ".history",
  ".idea",
  ".pytest_cache",
  ".venv",
  ".vscode",
  "cache",
  "requirements",
  "web",
]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"autosubliminal/providers/pitcher.py" = ["E722"]
"autosubliminal/providers/useragents.py" = ["E501"]
"autosubliminal/providers/addic7ed_custom.py" = ["F401", "E741"]
"autosubliminal/subsynchronizer.py" = ["F401"]
"autosubliminal/util/common.py" = ["E731"]
"autosubliminal/providers/opensubtitles_com.py" = ["E741"]
"autosubliminal/core/scheduler.py" = ["E722"]

[tool.ruff.lint.isort]
extra-standard-library = ["pkg_resources"]
known-first-party = ["autosubliminal"]
default-section = "third-party"
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]

[tool.ruff.format]
quote-style = "single"
